<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="20" cy="20" r="18" fill="url(#gradient)" stroke="#e1e5e9" stroke-width="2"/>
  
  <!-- 文档图标 -->
  <rect x="12" y="8" width="12" height="16" rx="2" fill="white" opacity="0.9"/>
  <rect x="14" y="11" width="8" height="1" fill="#4a5568"/>
  <rect x="14" y="13" width="6" height="1" fill="#4a5568"/>
  <rect x="14" y="15" width="7" height="1" fill="#4a5568"/>
  <rect x="14" y="17" width="5" height="1" fill="#4a5568"/>
  
  <!-- 缓存符号 (C) -->
  <circle cx="28" cy="28" r="6" fill="#3182ce" opacity="0.8"/>
  <text x="28" y="32" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">C</text>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
