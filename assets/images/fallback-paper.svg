<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- 装饰性几何图形 -->
  <circle cx="50" cy="50" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="350" cy="80" r="15" fill="rgba(255,255,255,0.08)"/>
  <circle cx="80" cy="250" r="25" fill="rgba(255,255,255,0.06)"/>
  <circle cx="320" cy="220" r="18" fill="rgba(255,255,255,0.1)"/>
  
  <!-- 主文档 -->
  <rect x="100" y="60" width="200" height="180" rx="8" fill="url(#paperGradient)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- 文档内容线条 -->
  <line x1="120" y1="100" x2="280" y2="100" stroke="#667eea" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="120" x2="260" y2="120" stroke="#764ba2" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="140" x2="270" y2="140" stroke="#f093fb" stroke-width="2" opacity="0.4"/>
  <line x1="120" y1="160" x2="250" y2="160" stroke="#667eea" stroke-width="2" opacity="0.3"/>
  <line x1="120" y1="180" x2="280" y2="180" stroke="#764ba2" stroke-width="2" opacity="0.2"/>
  
  <!-- 文档标题 -->
  <text x="200" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3748">PaperCache</text>
  
  <!-- 装饰性图标 -->
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="15" fill="rgba(102, 126, 234, 0.2)" stroke="rgba(102, 126, 234, 0.5)" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#667eea">📄</text>
  </g>
  
  <!-- 底部文字 -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">AI Research Papers</text>
  
  <!-- 分割线 -->
  <line x1="150" y1="280" x2="250" y2="280" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
</svg>

