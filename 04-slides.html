<!-- slides 已改为服务端保护：数据在 Supabase 私有表 slides_search + 私有桶 slides，
     RLS 仅放行管理员。本页面在浏览器里经 supabase-js（携带登录态）拉取，非管理员拿到空列表。 -->
<div class="slides-private-page">
  <div id="slides-gate">
    <div class="slides-gate-card">
      <div class="slides-gate-icon">🔒</div>
      <h1>演示文稿合集</h1>
      <p id="slides-gate-msg">正在验证管理员权限…</p>
      <button id="slides-login-btn" class="slides-btn" style="display:none">立即登录</button>
    </div>
  </div>

  <div id="slides-app" style="display:none">
    <header class="slides-head">
      <h1>演示文稿合集</h1>
      <p id="slides-count">加载中…</p>
    </header>
    <input id="slides-search" type="search" placeholder="搜索标题 / 摘要 / 分类…" />
    <div id="slides-list" class="slides-list"></div>
  </div>
</div>

<!-- 阅读层：从私有桶拉 HTML，抽出 .post-content 原样渲染 -->
<div id="slides-viewer" style="display:none">
  <div class="slides-viewer-bar">
    <button id="slides-viewer-close" class="slides-btn">‹ 返回列表</button>
    <span id="slides-viewer-title"></span>
  </div>
  <div id="slides-viewer-body" class="post-content"></div>
</div>

<style>
  .slides-private-page { min-height: 60vh; }
  .slides-gate-card { max-width: 420px; margin: 80px auto; padding: 40px 32px; text-align: center;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; }
  .slides-gate-icon { font-size: 40px; }
  .slides-btn { display: inline-block; margin-top: 16px; padding: 10px 28px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #10b981); color: #fff; font-size: 15px; cursor: pointer; }
  .slides-head h1 { margin: 24px 0 4px; }
  #slides-search { width: 100%; box-sizing: border-box; margin: 12px 0 20px; padding: 12px 16px;
    border: 1px solid #e2e8f0; border-radius: 10px; font-size: 15px; }
  .slides-list { display: grid; gap: 10px; margin-bottom: 48px; }
  .slide-row { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px; background: #fff;
    border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; }
  .slide-row:hover { border-color: #3b82f6; }
  .slide-date { flex-shrink: 0; font-size: 12px; color: #64748b; font-variant-numeric: tabular-nums; }
  .slide-cats { flex-shrink: 0; }
  .slide-cats span { display: inline-block; margin-right: 4px; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; color: #fff; background: linear-gradient(135deg, #3b82f6, #10b981); }
  .slide-title { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #slides-viewer { position: fixed; inset: 0; z-index: 999; background: #fff; overflow-y: auto; }
  .slides-viewer-bar { position: sticky; top: 0; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
  .slides-viewer-bar .slides-btn { margin-top: 0; padding: 8px 16px; }
  #slides-viewer-title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #slides-viewer-body { max-width: 820px; margin: 0 auto; padding: 24px 20px 64px; }
</style>

<script>
  (function () {
    var gate = document.getElementById('slides-gate');
    var app = document.getElementById('slides-app');
    var msg = document.getElementById('slides-gate-msg');
    var loginBtn = document.getElementById('slides-login-btn');
    var allSlides = [];

    function deny(text, showLogin) {
      msg.textContent = text;
      loginBtn.style.display = showLogin ? '' : 'none';
    }

    async function checkAccess() {
      // 等 SimpleAuth / supabase-client 加载（head 里 defer）
      for (var i = 0; i < 50 && !(window.SimpleAuth && window.getSupabaseClient); i++) {
        await new Promise(function (r) { setTimeout(r, 100); });
      }
      if (!window.SimpleAuth || !window.getSupabaseClient) return deny('认证服务未加载，请刷新重试。');
      var user = window.SimpleAuth.getCurrentUser && window.SimpleAuth.getCurrentUser();
      if (!user) return deny('此页面仅限管理员访问，请先登录。', true);
      var supabase = window.getSupabaseClient();
      var res = await supabase.rpc('check_user_is_admin', { p_user_id: user.id });
      if (!res.data) return deny('此页面仅限管理员访问。');
      gate.style.display = 'none';
      app.style.display = '';
      loadSlides();
    }

    async function loadSlides() {
      var supabase = window.getSupabaseClient();
      // RLS 在服务端拦截：非管理员即使绕过前端也会拿到空列表/错误
      var res = await supabase.from('slides_search')
        .select('post_url,title,excerpt,categories,tag,published_date')
        .order('published_date', { ascending: false });
      if (res.error) { document.getElementById('slides-count').textContent = '加载失败：' + res.error.message; return; }
      allSlides = res.data || [];
      document.getElementById('slides-count').textContent = '共 ' + allSlides.length + ' 篇（与 App 内管理员可见的演示文稿一致）';
      renderList('');
    }

    function renderList(q) {
      q = q.toLowerCase();
      var rows = allSlides.filter(function (s) {
        return !q || (s.title + ' ' + (s.excerpt || '') + ' ' + (s.categories || []).join(' ')).toLowerCase().indexOf(q) >= 0;
      });
      document.getElementById('slides-list').innerHTML = rows.map(function (s) {
        var cats = (s.categories || []).slice(0, 3).map(function (c) {
          return '<span>' + c + '</span>';
        }).join('');
        return '<div class="slide-row" data-url="' + s.post_url + '">' +
          '<span class="slide-date">' + (s.published_date || '') + '</span>' +
          '<span class="slide-cats">' + cats + '</span>' +
          '<span class="slide-title">' + s.title + '</span></div>';
      }).join('') || '<p>没有匹配的演示文稿。</p>';
    }

    async function openSlide(postUrl) {
      var viewer = document.getElementById('slides-viewer');
      var body = document.getElementById('slides-viewer-body');
      document.getElementById('slides-viewer-title').textContent = '';
      body.innerHTML = '<p>加载中…</p>';
      viewer.style.display = '';
      var supabase = window.getSupabaseClient();
      // 对象键 = sha256(post_url) 前 16 位 + .html（与 CI 同步脚本一致，避开 Storage 中文键 bug）
      var digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(postUrl));
      var path = Array.from(new Uint8Array(digest)).map(function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('').slice(0, 16) + '.html';
      var res = await supabase.storage.from('slides').download(path);
      if (res.error) { body.innerHTML = '<p>加载失败：' + res.error.message + '</p>'; return; }
      var html = await res.data.text();
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var content = doc.querySelector('.post-content');
      if (!content) { body.innerHTML = '<p>内容格式异常。</p>'; return; }
      content.querySelectorAll('script, style, iframe').forEach(function (n) { n.remove(); });
      document.getElementById('slides-viewer-title').textContent =
        (doc.querySelector('.post-title') || {}).textContent || '';
      body.innerHTML = content.innerHTML;
      window.scrollTo(0, 0);
    }

    document.getElementById('slides-search').addEventListener('input', function (e) { renderList(e.target.value.trim()); });
    document.getElementById('slides-list').addEventListener('click', function (e) {
      var row = e.target.closest('[data-url]');
      if (row) openSlide(row.dataset.url);
    });
    document.getElementById('slides-viewer-close').addEventListener('click', function () {
      document.getElementById('slides-viewer').style.display = 'none';
    });
    loginBtn.addEventListener('click', function () {
      if (window.openAuthModal) window.openAuthModal('login');
    });
    checkAccess();
  })();
</script>
