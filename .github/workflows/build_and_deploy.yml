name: Build and Deploy Jekyll Site

on:
  repository_dispatch:
    types: [trigger-build]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # Use PAT to allow pushing to gh-pages
          ref: main
          fetch-depth: 0

      - name: 💎 Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2" # Updated to support bundler 2.7.1
          bundler-cache: true

      - name: 🐍 Setup Python for thumbnail generation
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies for thumbnails
        run: |
          pip install Pillow PyYAML beautifulsoup4 requests

      - name: 🧪 Test thumbnail generation environment
        run: |
          python scripts/test_thumbnails.py

      - name: 🔨 Build the site (first build for thumbnail extraction)
        run: bundle exec jekyll build  --config _config.yml
        env:
          JEKYLL_ENV: production

      - name: 🖼️ Generate thumbnails
        run: |
          python scripts/gen_thumbs.py --root . --out assets/images/thumbs --size 320x200

      - name: 📊 Check thumbnails
        run: |
          echo "检查生成的缩略图..."
          echo "thumbnails_by_path.yml 行数: $(wc -l < _data/thumbnails_by_path.yml)"
          echo "缩略图文件数量: $(ls -1 assets/images/thumbs/ | wc -l)"
          echo "=== 缩略图 mapping 前10行预览 ==="
          head -n 10 _data/thumbnails_by_path.yml

      - name: 🧹 Clean Jekyll cache before rebuild
        run: |
          echo "清理 Jekyll 缓存..."
          rm -rf .jekyll-cache .jekyll-metadata _site

      - name: 🔨 Rebuild the site (second build to include thumbnails)
        run: bundle exec jekyll build --config _config.yml
        env:
          JEKYLL_ENV: production

      - name: 🗜️ Compress assets
        run: |
          # 压缩HTML文件
          find _site -name "*.html" -exec gzip -k {} \;
          # 压缩CSS文件
          find _site -name "*.css" -exec gzip -k {} \;
          # 压缩JS文件
          find _site -name "*.js" -exec gzip -k {} \;
          # 压缩XML文件
          find _site -name "*.xml" -exec gzip -k {} \;
          # 压缩缩略图文件
          find _site -name "*.jpg" -path "*/thumbs/*" -exec gzip -k {} \;

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./_site
          # Optional: if you have a custom domain
          # cname: your.domain.com
