name: Deploy Jekyll site to Pages

on:
    # 当收到 deepnotes 的触发事件时运行
    repository_dispatch:
        types: [trigger-build]

    # 允许从 Actions 选项卡手动运行
    workflow_dispatch:

    # 当直接推送到 main 分支时运行
    push:
        branches: ["main"]

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# 只允许一个并发部署，跳过正在运行和最新排队的运行之间的运行
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
    group: "pages"
    cancel-in-progress: false

env:
    PYTHON_VERSION: "3.11"

jobs:
    # 构建作业
    build:
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4

            - name: 🐍 Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: 📦 Install Python dependencies
              run: |
                  pip install beautifulsoup4 PyYAML lxml Pillow requests

            - name: 💎 Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.2"
                  bundler-cache: true
                  cache-version: 0

            - name: 🔧 Setup Pages
              id: pages
              uses: actions/configure-pages@v4

            - name: 🏗️ Build with Jekyll (first build for thumbnail extraction)
              run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
              env:
                  JEKYLL_ENV: production

            - name: 🖼️ Generate thumbnails
              run: |
                  echo "开始生成缩略图..."
                  python3 scripts/gen_thumbs.py --placeholder
                  echo "缩略图生成完成！"

            - name: 📊 Check thumbnails
              run: |
                  echo "检查生成的缩略图..."
                  echo "thumbnails_by_path.yml 行数: $(wc -l < _data/thumbnails_by_path.yml)"
                  echo "缩略图文件数量: $(ls -1 assets/images/thumbs/ | wc -l)"
                  echo "=== 缩略图 mapping 前10行预览 ==="
                  head -n 10 _data/thumbnails_by_path.yml

            - name: 🧹 Clean Jekyll cache before rebuild
              run: |
                  echo "清理 Jekyll 缓存..."
                  rm -rf .jekyll-cache .jekyll-metadata _site

            - name: 🏗️ Rebuild with Jekyll (second build to include thumbnails)
              run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
              env:
                  JEKYLL_ENV: production

            - name: 📤 Upload artifact
              uses: actions/upload-pages-artifact@v3

    # 部署作业
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: 🚀 Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
