name: Build Android App

# mobile/ 有改动推到 main 时：打包签名 APK → 发 GitHub Release → 触发站点部署，
# 部署时把最新 APK 拷到 papercache.org/download/，导航栏「App」页从站点自己的域名下载
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 等签名 Secrets，见 mobile/README.md「发布」一节"
            exit 1
          fi

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: ☕ Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - name: 🏷️ Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$VERSION" >> $GITHUB_OUTPUT
          echo "code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "tag=app-v$VERSION-build${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: 🩺 Keystore 体检
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "sha256: $(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 | sed 's/papercache/***/g' | head -6

      - name: 🏗️ Build web + sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run sync

      - name: 📱 Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          cd android
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PaperCache.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$RUNNER_TEMP/PaperCache.apk" | head -3

      - name: 🚀 Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "$RUNNER_TEMP/PaperCache.apk" \
            --title "PaperCache App ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})" \
            --notes "安卓安装包。也可从 https://www.papercache.org/app/ 下载。" \
            --target "${{ github.sha }}" \
            --latest

      - name: 🔄 Redeploy site with new APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
