title: PaperCache
description: "深度学习、机器学习和人工智能研究论文的精选缓存"
baseurl: "/papercache"
url: "https://shenh10.github.io"

author:
  name: shenh10
  email: thushenhan@gmail.com
  bio: "AI/ML研究者，专注于深度学习和机器学习系统研究"

# Jekyll设置
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# 内存优化设置
exclude:
  - "*.log"
  - "*.tmp"
  - "node_modules"
  - "vendor"
  - ".git"
  - ".DS_Store"

# 限制处理的内容
paginate: 20  # 每页显示的文章数量
paginate_path: "/page:num/"  # 分页路径

# 限制feed中的文章数量
jekyll-feed:
  limit: 20  # 限制feed中文章数量

# 顶部导航仅展示指定页面
header_pages:
  - 01-index.markdown
  - 02-collection.html
  - 03-about.markdown
  - 04-slides.html

# Jekyll Feed 配置 - 限制feed大小
jekyll-feed:
  limit: 10  # 限制feed中文章数量
  excerpt_only: true  # 只包含摘要，不包含全文
  excerpt_separator: "<!--more-->"  # 摘要分隔符
  excerpt_length: 200  # 限制摘要长度

# Kramdown设置
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  auto_ids: true
  toc_levels: 1..6

# 评论系统 (Giscus)
giscus:
  repo: "shenh10/papercache"
  repo_id: "R_kgDOPi7gwg"
  category: "博客评论"
  category_id: "DIC_kwDOPi7gws4CuiaX"
  mapping: "pathname"
  reactions_enabled: "1"
  theme: "light"
  lang: "zh-CN"

# 统计系统
google_analytics: "G-MWWFKJXJLN"
busuanzi_analytics: true

# 默认设置
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      mathjax: true
      share: true
      permalink: /papers/:categories/:year/:month/:day/:title.html
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# 分页 (已移除)
# paginate: 10
# paginate_path: "/page:num/"

# 排除文件
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .DS_Store
  - 04-slides.html
  - _slides/




