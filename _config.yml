title: PaperCache
description: "深度学习、机器学习和人工智能研究论文的精选缓存"
baseurl: "/papercache"
url: "https://shenh10.github.io"

# RSS Feed 配置 - 生产环境 URL（始终使用，不受本地开发环境影响）
rss_base_url: "https://shenh10.github.io/papercache"

# API 配置 - Vercel Functions 部署地址
# 生产环境 API 应该指向 Vercel，因为 GitHub Pages 不支持动态 API
api_base_url: "https://papercache.vercel.app"

# Supabase 配置 - 用户管理系统
# 注意：这些值应该从环境变量读取，不要在代码中硬编码
# 在生产环境中，通过Vercel或GitHub Actions的环境变量设置
supabase:
  url: ""  # 从环境变量 SUPABASE_URL 读取
  anon_key: ""  # 从环境变量 SUPABASE_ANON_KEY 读取
  enabled: true  # 是否启用用户系统

# 管理员配置
admin:
  enabled: true
  # 注意：admin_emails 已废弃，现在使用数据库的 admins 表管理
  # 保留此配置仅用于向后兼容（如果数据库函数不可用时降级使用）
  # 推荐方式：通过管理后台或执行 supabase-init-admin.sql 初始化管理员
  admin_emails:
    - "thushenhan@gmail.com"  # 向后兼容：现有管理员邮箱（已废弃，建议删除）
    # 添加更多管理员邮箱（每行一个）
    # - "your-admin-email@example.com"

author:
  name: shenh10
  email: thushenhan@gmail.com
  bio: "AI/ML研究者，专注于深度学习和机器学习系统研究"

# Jekyll设置
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# 内存优化设置
exclude:
  - "*.log"
  - "*.tmp"
  - "node_modules"
  - "vendor"
  - ".git"
  - ".DS_Store"
  - ".thumb_tmp"
  - "_site_bkp"
  - "test_ci_env"
  - ".sass-cache/"
  - ".jekyll-cache/"
  - "Gemfile"
  - "Gemfile.lock"
  - "04-slides.html"
  - "_slides/"

# 增量构建配置（仅用于本地开发，生产环境通过清除缓存强制完全构建）
incremental: false

# 限制处理的内容
paginate: 20  # 每页显示的文章数量
paginate_path: "/page:num/"  # 分页路径

# 顶部导航仅展示指定页面
# 注意：04-slides.html 仅在本地开发时显示（通过 _config_local.yml 添加）
header_pages:
  - 01-index.markdown
  - 02-collection.html
  - 03-about.markdown

# Jekyll Feed 配置 - 包含所有文章
jekyll-feed:
  excerpt_only: true  # 只包含摘要，不包含全文
  excerpt_separator: "<!--more-->"  # 摘要分隔符
  excerpt_length: 200  # 限制摘要长度

# Kramdown设置
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  input: GFM
  auto_ids: true
  toc_levels: 1..6

# 评论系统 (Giscus)
giscus:
  repo: "shenh10/papercache"
  repo_id: "R_kgDOPi7gwg"
  category: "博客评论"
  category_id: "DIC_kwDOPi7gws4CuiaX"
  mapping: "pathname"
  reactions_enabled: "1"
  theme: "light"
  lang: "zh-CN"

# 统计系统
google_analytics: "G-MWWFKJXJLN"
busuanzi_analytics: true

# Collections 配置
# 注意：slides collection 仅在本地开发时启用（通过 _config_local.yml 添加）

# 默认设置
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      mathjax: true
      share: true
      permalink: /papers/:categories/:year/:month/:day/:title.html
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# 分页 (已移除)
# paginate: 10
# paginate_path: "/page:num/"

