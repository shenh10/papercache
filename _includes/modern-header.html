<!-- 现代化头部导航 -->
<header class="modern-header">
  <div class="header-container">
    <!-- Logo和品牌 -->
    <a href="{{ '/' | relative_url }}" class="logo-section">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="PaperCache Logo" class="logo">
      <div class="brand-text">
        <h1 class="brand-name">PaperCache</h1>
        <p class="brand-tagline">AI Research Papers</p>
      </div>
    </a>
    
    <!-- 移动端汉堡菜单按钮 -->
    <button class="mobile-menu-toggle" aria-label="Toggle navigation menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    
    <!-- 导航菜单 -->
    <nav class="main-nav">
      <ul class="nav-menu">
        {% for page_path in site.header_pages %}
          {% assign page_obj = site.pages | where: "path", page_path | first %}
          {% if page_obj %}
            <li class="nav-item">
              <a href="{{ page_obj.url | relative_url }}" 
                 class="nav-link {% if page.url == page_obj.url %}active{% endif %}">
                {{ page_obj.title }}
              </a>
            </li>
          {% endif %}
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<!-- 样式文件 -->
<link rel="stylesheet" href="{{ '/assets/css/modern-header.css' | relative_url }}">

<!-- 移动端菜单交互脚本 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
  const mainNav = document.querySelector('.main-nav');
  
  if (mobileMenuToggle && mainNav) {
    mobileMenuToggle.addEventListener('click', function() {
      mobileMenuToggle.classList.toggle('active');
      mainNav.classList.toggle('active');
    });
    
    // 点击导航链接后关闭菜单
    const navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(link => {
      link.addEventListener('click', function() {
        mobileMenuToggle.classList.remove('active');
        mainNav.classList.remove('active');
      });
    });
    
    // 点击页面其他区域关闭菜单
    document.addEventListener('click', function(e) {
      if (!mobileMenuToggle.contains(e.target) && !mainNav.contains(e.target)) {
        mobileMenuToggle.classList.remove('active');
        mainNav.classList.remove('active');
      }
    });
  }
});
</script>
