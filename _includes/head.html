<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- 性能优化：预加载关键资源 -->
  <link rel="preload" href="{{ "/assets/main.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-collection.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-header.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-homepage.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-about.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/js/post-preview.js" | relative_url }}" as="script">
  <link rel="preload" href="{{ "/assets/js/card-enhancements.js" | relative_url }}" as="script">
  
  <!-- 缓存控制 -->
  <meta http-equiv="Cache-Control" content="public, max-age=31536000">
  
  <!-- SEO tags removed for compatibility -->
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <!-- Feed meta removed for compatibility -->
  
  <!-- 防止FOUC的基础样式 -->
  <style>
    /* 确保页面在CSS加载前有基础样式 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
    }
    
    /* 隐藏可能闪烁的元素直到JavaScript加载完成 */
    #tag-count-modern:not(.loaded),
    #tag-buttons-container-modern:not(.loaded) {
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }
    
    /* 确保关键布局元素立即显示 */
    .collection-hero,
    .modern-tag-filter,
    .modern-navigation {
      visibility: visible;
    }
  </style>
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- MathJax 3 Configuration - 延迟加载 -->
  {%- if page.mathjax != false -%}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']]
      },
      svg: {
        fontCache: 'global'
      },
      startup: {
        ready: function () {
          MathJax.startup.defaultReady();
          console.log('MathJax is loaded, but not yet initialized');
        }
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
  </script>
  {%- endif -%}

  <!-- Busuanzi Analytics - 延迟加载 -->
  <script>
    // 延迟加载统计脚本
    setTimeout(function() {
      var script = document.createElement('script');
      script.async = true;
      script.src = '//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
      document.head.appendChild(script);
    }, 2000);
  </script>
</head>
