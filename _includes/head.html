<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- 性能优化：预加载关键资源 -->
  <link rel="preload" href="{{ "/assets/main.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-collection.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-header.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-homepage.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/css/modern-about.css" | relative_url }}" as="style">
  <link rel="preload" href="{{ "/assets/js/post-preview.js" | relative_url }}" as="script">
  <link rel="preload" href="{{ "/assets/js/card-enhancements.js" | relative_url }}" as="script">
  
  <!-- 缓存控制 -->
  <meta http-equiv="Cache-Control" content="public, max-age=31536000">
  
  <!-- SEO tags removed for compatibility -->
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}?v=1761019000">
    <link rel="stylesheet" href="{{ "/assets/css/modern-collection.css" | relative_url }}?v=1761019000">
  <!-- RSS Feed 自动发现 -->
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} - 最新收录" href="{{ "/feed.xml" | relative_url }}" />
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} - 最新发表" href="{{ "/feeds/latest-published.xml" | relative_url }}" />
  
  <!-- 防止FOUC的基础样式 -->
  <style>
    /* 确保页面在CSS加载前有基础样式 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
    }
    
    /* 隐藏可能闪烁的元素直到JavaScript加载完成 */
    #tag-count-modern:not(.loaded),
    #tag-buttons-container-modern:not(.loaded) {
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }
    
    /* 确保关键布局元素立即显示 */
    .collection-hero,
    .modern-tag-filter,
    .modern-navigation {
      visibility: visible;
    }
    
    /* 立即移除列表样式，防止闪现无CSS美化的列表 */
    .post-list-with-tags,
    .post-list-with-tags ul {
      list-style: none !important;
      padding-left: 0 !important;
      margin-left: 0 !important;
    }
    
    .post-item {
      list-style: none !important;
    }
    
    /* 立即移除移动端列表样式 */
    .post-list-mobile {
      list-style: none !important;
      padding-left: 0 !important;
      margin-left: 0 !important;
    }
    
    .mobile-post-item {
      list-style: none !important;
    }
    
    .mobile-post-item::marker {
      display: none !important;
    }
    
    /* 移动端MathJax优化样式 */
    @media (max-width: 768px) {
      .MathJax {
        font-size: 0.9em !important;
        line-height: 1.2 !important;
        max-width: 100% !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
      }
      
      .MathJax_Display {
        margin: 1em 0 !important;
        padding: 0.5em !important;
        overflow-x: auto !important;
        overflow-y: hidden !important;
      }
      
      .MathJax_SVG {
        max-width: 100% !important;
        height: auto !important;
      }
      
      /* 确保数学公式在小屏幕上不会溢出 */
      .post-content .MathJax,
      .page-content .MathJax {
        word-wrap: break-word !important;
        overflow-wrap: break-word !important;
      }
      
      /* 移动端数学公式容器 */
      .math-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.5em 0;
      }
    }
    
    /* 超小屏幕优化 */
    @media (max-width: 480px) {
      .MathJax {
        font-size: 0.8em !important;
        line-height: 1.1 !important;
      }
      
      .MathJax_Display {
        margin: 0.8em 0 !important;
        padding: 0.3em !important;
      }
    }
  </style>
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- MathJax 3 Configuration - 移动端优化 -->
  {%- if page.mathjax != false -%}
  <!-- ES6 Polyfill for mobile browsers -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$']],
        displayMath: [['$$', '$$']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      },
      // 移动端优化配置
      chtml: {
        scale: 1.0,
        minScale: 0.5,
        maxScale: 2.0,
        adaptiveCSS: true,
        linebreaks: {
          automatic: true,
          width: 'container'
        }
      },
      // 移动端启动配置
      startup: {
        ready: function () {
          MathJax.startup.defaultReady();
          console.log('MathJax is loaded and ready for mobile');
          
          // 移动端特殊处理
          if (window.innerWidth <= 768) {
            // 调整移动端数学公式缩放
            MathJax.typesetPromise().then(() => {
              const mathElements = document.querySelectorAll('.MathJax');
              mathElements.forEach(element => {
                element.style.fontSize = '0.9em';
                element.style.lineHeight = '1.2';
              });
            });
          }
        }
      }
    };
  </script>
  
  <!-- 使用CHTML渲染器，更适合移动端 -->
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  
  <!-- 移动端MathJax优化脚本 -->
  <script src="{{ "/assets/js/mathjax-mobile.js" | relative_url }}"></script>
  {%- endif -%}

  <!-- Busuanzi Analytics - 延迟加载 -->
  <script>
    // 延迟加载统计脚本
    setTimeout(function() {
      var script = document.createElement('script');
      script.async = true;
      script.src = '//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
      document.head.appendChild(script);
    }, 2000);
  </script>
</head>
