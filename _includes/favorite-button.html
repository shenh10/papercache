<!-- 收藏按钮组件 -->
{%- if site.supabase and site.supabase.enabled -%}
<button class="favorite-btn" 
        data-post-url="{{ page.url | relative_url }}"
        id="favorite-btn-{{ page.url | slugify }}"
        onclick="handleToggleFavorite('{{ page.url | relative_url }}')"
        title="收藏这篇文章">
  <span class="favorite-icon" id="favorite-icon-{{ page.url | slugify }}">🤍</span>
  <span class="favorite-text" id="favorite-text-{{ page.url | slugify }}">收藏</span>
  <span class="favorite-count" id="favorite-count-{{ page.url | slugify }}"></span>
</button>

<script>
// 初始化收藏按钮状态
document.addEventListener('DOMContentLoaded', async function() {
  const postUrl = '{{ page.url | relative_url }}';
  const btn = document.getElementById('favorite-btn-' + postUrl.replace(/[^a-z0-9]/gi, ''));
  const icon = document.getElementById('favorite-icon-' + postUrl.replace(/[^a-z0-9]/gi, ''));
  const text = document.getElementById('favorite-text-' + postUrl.replace(/[^a-z0-9]/gi, ''));
  const countEl = document.getElementById('favorite-count-' + postUrl.replace(/[^a-z0-9]/gi, ''));
  
  if (!btn || !window.favoritesService) return;
  
  // 检查收藏状态
  const isFavorited = await window.favoritesService.isPostFavorited(postUrl);
  updateFavoriteButtonUI(btn, icon, text, isFavorited);
  
  // 获取收藏数
  const countResult = await window.favoritesService.getPostFavoriteCount(postUrl);
  if (countResult.success && countEl) {
    countEl.textContent = countResult.count > 0 ? `(${countResult.count})` : '';
  }
});

// 更新收藏按钮UI
function updateFavoriteButtonUI(btn, icon, text, isFavorited) {
  if (isFavorited) {
    btn.classList.add('favorited');
    if (icon) icon.textContent = '❤️';
    if (text) text.textContent = '已收藏';
  } else {
    btn.classList.remove('favorited');
    if (icon) icon.textContent = '🤍';
    if (text) text.textContent = '收藏';
  }
}

// 处理收藏/取消收藏
window.handleToggleFavorite = async function(postUrl) {
  if (!window.favoritesService) {
    alert('收藏功能不可用，请刷新页面重试');
    return;
  }
  
  const btnId = 'favorite-btn-' + postUrl.replace(/[^a-z0-9]/gi, '');
  const btn = document.getElementById(btnId);
  const icon = document.getElementById('favorite-icon-' + postUrl.replace(/[^a-z0-9]/gi, ''));
  const text = document.getElementById('favorite-text-' + postUrl.replace(/[^a-z0-9]/gi, ''));
  const countEl = document.getElementById('favorite-count-' + postUrl.replace(/[^a-z0-9]/gi, ''));
  
  if (!btn) return;
  
  // 显示加载状态
  btn.disabled = true;
  btn.classList.add('loading');
  
  // 切换收藏状态
  const result = await window.favoritesService.toggleFavorite(postUrl);
  btn.disabled = false;
  btn.classList.remove('loading');
  
  if (result.success) {
    updateFavoriteButtonUI(btn, icon, text, result.favorited);
    
    // 更新收藏数
    if (countEl) {
      const countResult = await window.favoritesService.getPostFavoriteCount(postUrl);
      if (countResult.success) {
        countEl.textContent = countResult.count > 0 ? `(${countResult.count})` : '';
      }
    }
    
    // 显示反馈动画
    btn.classList.add('clicked');
    setTimeout(() => {
      btn.classList.remove('clicked');
    }, 600);
  } else {
    if (result.error === '请先登录') {
      if (window.openAuthModal) {
        window.openAuthModal('login');
      }
    } else {
      alert('操作失败：' + (result.error || '未知错误'));
    }
  }
};
</script>

<style>
.favorite-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  background: white;
  border: 2px solid #e2e8f0;
  border-radius: 8px;
  color: #4a5568;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.favorite-btn:hover {
  border-color: #667eea;
  background: #f7fafc;
  color: #667eea;
}

.favorite-btn.favorited {
  border-color: #f56565;
  background: #fed7d7;
  color: #c53030;
}

.favorite-btn.favorited:hover {
  background: #fc8181;
  color: white;
}

.favorite-btn.loading {
  opacity: 0.6;
  cursor: not-allowed;
}

.favorite-btn.clicked {
  transform: scale(1.1);
}

.favorite-icon {
  font-size: 1.1rem;
  transition: transform 0.2s;
}

.favorite-btn.clicked .favorite-icon {
  animation: heartBeat 0.6s ease;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  25% { transform: scale(1.3); }
  50% { transform: scale(1.1); }
  75% { transform: scale(1.2); }
}

.favorite-count {
  font-size: 0.8rem;
  color: #718096;
  margin-left: 0.25rem;
}

.favorite-btn.favorited .favorite-count {
  color: #c53030;
}
</style>
{%- endif -%}
