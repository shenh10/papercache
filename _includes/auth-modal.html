<!-- 登录/注册模态框 -->
<div id="auth-modal" class="auth-modal" style="display: none;">
  <div class="auth-modal-overlay" onclick="closeAuthModal()"></div>
  <div class="auth-modal-content">
    <button class="auth-modal-close" onclick="closeAuthModal()">&times;</button>
    
    <!-- 登录表单 -->
    <div id="auth-login-form" class="auth-form active">
      <h2>登录</h2>
      
      <!-- OAuth登录按钮 -->
      <div class="auth-oauth-buttons">
        <button class="auth-btn auth-btn-github" onclick="handleGitHubLogin()">

          </svg>
          使用 GitHub 登录
        </button>
        
        <button class="auth-btn auth-btn-google" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          使用 Google 登录
        </button>
      </div>
      
      <div class="auth-divider">
        <span>或</span>
      </div>
      
      <!-- 邮箱登录表单 -->
      <form id="email-login-form" onsubmit="handleEmailLogin(event)">
        <div class="auth-form-group">
          <label for="login-email">邮箱</label>
          <input type="email" id="login-email" name="email" required autocomplete="email">
        </div>
        
        <div class="auth-form-group">
          <label for="login-password">密码</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="auth-btn auth-btn-primary">登录</button>
      </form>
      
      <div class="auth-form-footer">
        <p>还没有账号？ <a href="#" onclick="switchToRegister()">立即注册</a></p>
      </div>
    </div>
    
    <!-- 注册表单 -->
    <div id="auth-register-form" class="auth-form" style="display: none;">
      <h2>注册</h2>
      
      <!-- OAuth注册（同登录） -->
      <div class="auth-oauth-buttons">
        <button class="auth-btn auth-btn-github" onclick="handleGitHubLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          使用 GitHub 注册
        </button>
        
        <button class="auth-btn auth-btn-google" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          使用 Google 注册
        </button>
      </div>
      
      <div class="auth-divider">
        <span>或</span>
      </div>
      
      <!-- 邮箱注册表单 -->
      <form id="email-register-form" onsubmit="handleEmailRegister(event)">
        <div class="auth-form-group">
          <label for="register-username">用户名</label>
          <input type="text" id="register-username" name="username" required autocomplete="username">
        </div>
        
        <div class="auth-form-group">
          <label for="register-email">邮箱</label>
          <input type="email" id="register-email" name="email" required autocomplete="email">
        </div>
        
        <div class="auth-form-group">
          <label for="register-password">密码</label>
          <input type="password" id="register-password" name="password" required autocomplete="new-password" minlength="6">
          <small class="auth-form-help">至少6个字符</small>
        </div>
        
        <button type="submit" class="auth-btn auth-btn-primary">注册</button>
      </form>
      
      <div class="auth-form-footer">
        <p>已有账号？ <a href="#" onclick="switchToLogin()">立即登录</a></p>
      </div>
    </div>
    
    <!-- 加载状态 -->
    <div id="auth-loading" class="auth-loading" style="display: none;">
      <div class="auth-spinner"></div>
      <p>处理中...</p>
    </div>
    
    <!-- 错误提示 -->
    <div id="auth-error" class="auth-error" style="display: none;">
      <p id="auth-error-message"></p>
    </div>
  </div>
</div>

<script>
// 模态框控制函数
function openAuthModal(mode = 'login') {
  const modal = document.getElementById('auth-modal');
  if (modal) {
    modal.style.display = 'flex';
    if (mode === 'register') {
      switchToRegister();
    } else {
      switchToLogin();
    }
  }
}

function closeAuthModal() {
  const modal = document.getElementById('auth-modal');
  if (modal) {
    modal.style.display = 'none';
  }
}

function switchToRegister() {
  document.getElementById('auth-login-form').classList.remove('active');
  document.getElementById('auth-login-form').style.display = 'none';
  document.getElementById('auth-register-form').classList.add('active');
  document.getElementById('auth-register-form').style.display = 'block';
}

function switchToLogin() {
  document.getElementById('auth-register-form').classList.remove('active');
  document.getElementById('auth-register-form').style.display = 'none';
  document.getElementById('auth-login-form').classList.add('active');
  document.getElementById('auth-login-form').style.display = 'block';
}

function showAuthError(message) {
  const errorDiv = document.getElementById('auth-error');
  const errorMsg = document.getElementById('auth-error-message');
  if (errorDiv && errorMsg) {
    errorMsg.textContent = message;
    errorDiv.style.display = 'block';
    setTimeout(() => {
      errorDiv.style.display = 'none';
    }, 5000);
  }
}

function showAuthLoading(show) {
  const loadingDiv = document.getElementById('auth-loading');
  if (loadingDiv) {
    loadingDiv.style.display = show ? 'block' : 'none';
  }
}

// 登录处理函数
async function handleGitHubLogin() {
  showAuthLoading(true);
  const result = await window.authService?.signInWithOAuth('github');
  showAuthLoading(false);
  if (!result?.success) {
    showAuthError(result?.error || 'GitHub登录失败');
  }
}

async function handleGoogleLogin() {
  showAuthLoading(true);
  const result = await window.authService?.signInWithOAuth('google');
  showAuthLoading(false);
  if (!result?.success) {
    showAuthError(result?.error || 'Google登录失败');
  }
}

async function handleEmailLogin(event) {
  event.preventDefault();
  showAuthLoading(true);
  
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  
  const result = await window.authService?.signInWithEmail(email, password);
  showAuthLoading(false);
  
  if (result?.success) {
    closeAuthModal();
  } else {
    showAuthError(result?.error || '登录失败');
  }
}

async function handleEmailRegister(event) {
  event.preventDefault();
  showAuthLoading(true);
  
  const username = document.getElementById('register-username').value;
  const email = document.getElementById('register-email').value;
  const password = document.getElementById('register-password').value;
  
  const result = await window.authService?.signUpWithEmail(email, password, username);
  showAuthLoading(false);
  
  if (result?.success) {
    showAuthError('注册成功！请查收邮箱验证链接。');
    setTimeout(() => {
      switchToLogin();
    }, 2000);
  } else {
    showAuthError(result?.error || '注册失败');
  }
}

// 按ESC键关闭模态框
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeAuthModal();
  }
});
</script>
