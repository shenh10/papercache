<!-- 登录/注册模态框 -->
<div id="auth-modal" class="auth-modal" style="display: none;">
  <div class="auth-modal-overlay" onclick="closeAuthModal()"></div>
  <div class="auth-modal-content">
    <button class="auth-modal-close" onclick="closeAuthModal()">&times;</button>
    
    <!-- 登录表单 -->
    <div id="auth-login-form" class="auth-form active">
      <h2>登录</h2>
      
      <!-- OAuth登录按钮 -->
      <div class="auth-oauth-buttons">
        <button class="auth-btn auth-btn-github" onclick="handleGitHubLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          使用 GitHub 登录
        </button>
      </div>
      
      <div class="auth-divider">
        <span>或</span>
      </div>
      
      <!-- 邮箱登录表单 -->
      <form id="email-login-form" onsubmit="handleEmailLogin(event)">
        <div class="auth-form-group">
          <label for="login-email">邮箱</label>
          <input type="email" id="login-email" name="email" required autocomplete="email">
        </div>
        
        <div class="auth-form-group">
          <label for="login-password">密码</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password">
        </div>
        
        <div class="auth-form-group" style="text-align: right; margin-bottom: 1rem;">
          <a href="#" onclick="switchToForgotPassword(); return false;" style="color: rgba(59, 130, 246, 0.9); text-decoration: none; font-size: 0.9rem;">忘记密码？</a>
        </div>
        
        <button type="submit" class="auth-btn auth-btn-primary">登录</button>
      </form>
      
      <div class="auth-form-footer">
        <p>还没有账号？ <a href="#" onclick="switchToRegister()">立即注册</a></p>
      </div>
    </div>
    
    <!-- 注册表单 -->
    <div id="auth-register-form" class="auth-form" style="display: none;">
      <h2>注册</h2>
      
      <!-- OAuth注册（同登录） -->
      <div class="auth-oauth-buttons">
        <button class="auth-btn auth-btn-github" onclick="handleGitHubLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          使用 GitHub 注册
        </button>
      </div>
      
      <div class="auth-divider">
        <span>或</span>
      </div>
      
      <!-- 邮箱注册表单 -->
      <form id="email-register-form" onsubmit="handleEmailRegister(event)">
        <div class="auth-form-group">
          <label for="register-username">用户名</label>
          <input type="text" id="register-username" name="username" required autocomplete="username">
        </div>
        
        <div class="auth-form-group">
          <label for="register-email">邮箱</label>
          <input type="email" id="register-email" name="email" required autocomplete="email">
        </div>
        
        <div class="auth-form-group">
          <label for="register-password">密码</label>
          <input type="password" id="register-password" name="password" required autocomplete="new-password" minlength="6">
          <small class="auth-form-help">至少6个字符</small>
        </div>
        
        <button type="submit" class="auth-btn auth-btn-primary">注册</button>
      </form>
      
      <div class="auth-form-footer">
        <p>已有账号？ <a href="#" onclick="switchToLogin()">立即登录</a></p>
      </div>
    </div>
    
    <!-- 忘记密码表单 -->
    <div id="auth-forgot-password-form" class="auth-form" style="display: none;">
      <h2>忘记密码</h2>
      
      <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">
        请输入您的邮箱地址，我们将发送密码重置链接到您的邮箱。
      </p>
      
      <form id="forgot-password-form" onsubmit="handleForgotPassword(event)">
        <div class="auth-form-group">
          <label for="forgot-email">邮箱</label>
          <input type="email" id="forgot-email" name="email" required autocomplete="email">
        </div>
        
        <button type="submit" class="auth-btn auth-btn-primary">发送重置链接</button>
      </form>
      
      <div class="auth-form-footer">
        <p><a href="#" onclick="switchToLogin()">返回登录</a></p>
      </div>
    </div>
    
    <!-- 重发验证邮件表单 -->
    <div id="auth-resend-email-form" class="auth-form" style="display: none;">
      <h2>重发验证邮件</h2>
      
      <p style="color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem;">
        未收到验证邮件？请输入您的邮箱地址，我们将重新发送验证链接。
      </p>
      
      <form id="resend-email-form" onsubmit="handleResendConfirmationEmail(event)">
        <div class="auth-form-group">
          <label for="resend-email">邮箱</label>
          <input type="email" id="resend-email" name="email" required autocomplete="email">
        </div>
        
        <button type="submit" class="auth-btn auth-btn-primary">重发验证邮件</button>
      </form>
      
      <div class="auth-form-footer">
        <p><a href="#" onclick="switchToLogin()">返回登录</a> | <a href="#" onclick="switchToRegister()">去注册</a></p>
      </div>
    </div>
    
    <!-- 加载状态 -->
    <div id="auth-loading" class="auth-loading" style="display: none;">
      <div class="auth-spinner"></div>
      <p>处理中...</p>
    </div>
    
    <!-- 错误提示 -->
    <div id="auth-error" class="auth-error" style="display: none;">
      <p id="auth-error-message"></p>
    </div>
  </div>
</div>

<script>
// 全局变量：标记是否登录超时（用于防止登录成功后自动关闭模态框）
// 防止重复声明
if (typeof window.isLoginTimeout === 'undefined') {
  window.isLoginTimeout = false;
}

// 模态框控制函数
function openAuthModal(mode = 'login') {
  const modal = document.getElementById('auth-modal');
  if (modal) {
    modal.style.display = 'flex'; // 确保使用 flex 布局
    // 清除之前的状态
    showAuthLoading(false);
    // 重置超时标记
    window.isLoginTimeout = false;
    // 打开模态框时清除之前的错误（新开始）
    showAuthError('');
    if (mode === 'register') {
      switchToRegister();
    } else {
      switchToLogin();
    }
    // 设置认证状态监听器（用于自动关闭模态框）
    setupAuthModalCloseListener();
  }
}

function closeAuthModal() {
  const modal = document.getElementById('auth-modal');
  if (modal) {
    modal.style.display = 'none';
    // 关闭时清除加载状态
    showAuthLoading(false);
    // 注意：不清除错误提示，让用户看到错误信息（除非手动关闭）
    // 如果确实需要清除错误，应该在成功登录时单独处理
  }
}

function switchToRegister() {
  document.getElementById('auth-login-form').classList.remove('active');
  document.getElementById('auth-login-form').style.display = 'none';
  document.getElementById('auth-register-form').classList.add('active');
  document.getElementById('auth-register-form').style.display = 'block';
}

function switchToLogin() {
  // 隐藏所有表单
  document.getElementById('auth-register-form').classList.remove('active');
  document.getElementById('auth-register-form').style.display = 'none';
  document.getElementById('auth-forgot-password-form').classList.remove('active');
  document.getElementById('auth-forgot-password-form').style.display = 'none';
  document.getElementById('auth-resend-email-form').classList.remove('active');
  document.getElementById('auth-resend-email-form').style.display = 'none';
  
  // 重置忘记密码表单（恢复显示，以便下次使用）
  const forgotPasswordForm = document.getElementById('forgot-password-form');
  if (forgotPasswordForm) {
    forgotPasswordForm.style.display = 'block';
  }
  const emailInput = document.getElementById('forgot-email');
  if (emailInput) {
    const formGroup = emailInput.closest('.auth-form-group');
    if (formGroup) {
      formGroup.style.display = '';
    }
  }
  const submitForm = document.getElementById('forgot-password-form');
  if (submitForm) {
    submitForm.style.display = '';
  }
  
  // 清除错误提示
  showAuthError('');
  
  // 显示登录表单
  document.getElementById('auth-login-form').classList.add('active');
  document.getElementById('auth-login-form').style.display = 'block';
}

function switchToForgotPassword() {
  // 隐藏所有表单
  document.getElementById('auth-login-form').classList.remove('active');
  document.getElementById('auth-login-form').style.display = 'none';
  document.getElementById('auth-register-form').classList.remove('active');
  document.getElementById('auth-register-form').style.display = 'none';
  document.getElementById('auth-resend-email-form').classList.remove('active');
  document.getElementById('auth-resend-email-form').style.display = 'none';
  
  // 显示忘记密码表单
  document.getElementById('auth-forgot-password-form').classList.add('active');
  document.getElementById('auth-forgot-password-form').style.display = 'block';
}

function switchToResendEmail() {
  // 隐藏所有表单
  document.getElementById('auth-login-form').classList.remove('active');
  document.getElementById('auth-login-form').style.display = 'none';
  document.getElementById('auth-register-form').classList.remove('active');
  document.getElementById('auth-register-form').style.display = 'none';
  document.getElementById('auth-forgot-password-form').classList.remove('active');
  document.getElementById('auth-forgot-password-form').style.display = 'none';
  
  // 显示重发邮件表单
  document.getElementById('auth-resend-email-form').classList.add('active');
  document.getElementById('auth-resend-email-form').style.display = 'block';
}

// 存储当前的自动隐藏定时器，以便可以取消
// 防止重复声明
if (typeof window.authErrorTimeout === 'undefined') {
  window.authErrorTimeout = null;
}

function showAuthError(message, autoHide = true) {
  const errorDiv = document.getElementById('auth-error');
  const errorMsg = document.getElementById('auth-error-message');
  if (errorDiv && errorMsg) {
    // 清除之前的定时器（如果有）
    if (window.authErrorTimeout) {
      clearTimeout(window.authErrorTimeout);
      window.authErrorTimeout = null;
    }
    
    // 如果消息为空或空白，隐藏错误框
    if (!message || message.trim() === '') {
      errorDiv.style.display = 'none';
      errorMsg.textContent = '';
      return;
    }
    
    errorMsg.textContent = message;
    errorDiv.style.display = 'block';
    
    // 只有非关键错误才自动隐藏（如成功提示）
    // 关键错误（超时、认证失败等）保留显示，直到用户手动操作
    if (autoHide && !message.includes('超时') && !message.includes('失败') && !message.includes('错误')) {
      window.authErrorTimeout = setTimeout(() => {
        errorDiv.style.display = 'none';
        window.authErrorTimeout = null;
      }, 5000);
    } else {
      // 关键错误：添加点击关闭功能
      errorDiv.style.cursor = 'pointer';
      errorDiv.title = '点击关闭';
      
      // 移除之前的事件监听器（如果有）
      const existingHandler = errorDiv._closeHandler;
      if (existingHandler) {
        errorDiv.removeEventListener('click', existingHandler);
      }
      
      // 添加点击关闭功能
      const closeHandler = function() {
        errorDiv.style.display = 'none';
        errorDiv.removeEventListener('click', closeHandler);
        errorDiv._closeHandler = null;
      };
      errorDiv._closeHandler = closeHandler;
      errorDiv.addEventListener('click', closeHandler);
    }
  }
}

function showAuthLoading(show) {
  const loadingDiv = document.getElementById('auth-loading');
  if (loadingDiv) {
    loadingDiv.style.display = show ? 'block' : 'none';
  }
}

// 登录处理函数
async function handleGitHubLogin() {
  console.log('[AuthModal] handleGitHubLogin 被调用');
  showAuthLoading(true);
  showAuthError(''); // 清除之前的错误

  try {
    console.log('[AuthModal] 检查 SimpleAuth 是否可用...');
    if (!window.SimpleAuth) {
      console.error('[AuthModal] SimpleAuth 未初始化');
      throw new Error('认证系统未初始化，请刷新页面重试');
    }

    console.log('[AuthModal] 开始GitHub登录...');
    console.log('[AuthModal] 调用 SimpleAuth.signInWithOAuth("github")');

    // 调用SimpleAuth的OAuth登录方法
    // Supabase会自动处理重定向到GitHub授权页面
    await window.SimpleAuth.signInWithOAuth('github');

    // 理论上不会执行到这里，因为Supabase会自动重定向
    console.log('[AuthModal] OAuth登录调用完成');

  } catch (error) {
    console.error('[AuthModal] GitHub登录失败:', error);
    console.error('[AuthModal] 错误详情:', error.stack);
    showAuthLoading(false);
    showAuthError('GitHub登录失败：' + (error.message || '未知错误'), false);
  }
}

// 监听认证状态变化，自动关闭模态框
// 防止重复声明
if (typeof window.authModalCloseListenerRegistered === 'undefined') {
  window.authModalCloseListenerRegistered = false;
}
function setupAuthModalCloseListener() {
  if (!window.authModalCloseListenerRegistered && window.SimpleAuth) {
    window.authModalCloseListenerRegistered = true;
    window.SimpleAuth.onAuthChange((user) => {
      const modal = document.getElementById('auth-modal');
      // 只在模态框显示时响应登录成功事件
      // 注意：如果登录最终成功了，无论是否超时，都应该清除错误并关闭模态框
      if (user && modal) {
        // 检查模态框是否真正显示（可能是 'flex' 或其他值，只要不是 'none'）
        const isModalVisible = modal.style.display !== 'none' && modal.style.display !== '';
        if (isModalVisible) {
          // 登录成功（无论是否之前超时），清除错误、关闭加载状态和模态框
          console.log('检测到登录成功（onAuthStateChange），关闭模态框', window.isLoginTimeout ? '（之前超时）' : '');
          showAuthLoading(false);
          showAuthError(''); // 成功时清除错误提示
          window.isLoginTimeout = false; // 重置超时标记
          closeAuthModal();
        } else {
          console.log('检测到登录成功，但模态框已关闭，无需操作');
        }
      }
    });
  }
}

async function handleEmailLogin(event) {
  event.preventDefault();
  showAuthLoading(true);
  showAuthError(''); // 清除之前的错误

  try {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    if (!window.SimpleAuth) {
      showAuthLoading(false);
      showAuthError('认证服务未加载，请刷新页面重试', false);
      return;
    }

    // 设置认证状态监听器（用于自动关闭模态框）
    setupAuthModalCloseListener();

    // 执行登录
    console.log('开始登录:', email);
    const result = await window.SimpleAuth.login(email, password);

    // 处理登录结果
    try {
      console.log('登录成功');
      showAuthLoading(false);
      showAuthError(''); // 成功时清除错误提示

      // 登录成功后，onAuthChange监听器会自动关闭模态框
      // 这里作为备份，如果监听器没有关闭，手动关闭
      setTimeout(() => {
        const modal = document.getElementById('auth-modal');
        if (modal && modal.style.display !== 'none') {
          console.log('手动关闭模态框（登录成功）');
          closeAuthModal();
        }
      }, 500);
    } catch (error) {
      // 登录失败
      showAuthLoading(false);
      const errorMessage = error?.message || '登录失败';
      showAuthError(errorMessage, false);

      // 如果是因为邮箱未验证，提示重发验证邮件
      if (errorMessage.includes('Email not confirmed') || errorMessage.includes('未验证') || errorMessage.includes('not confirmed')) {
        setTimeout(() => {
          showAuthError(errorMessage + '。点击"重发验证邮件"可重新发送验证链接。', false);
        }, 2000);
      }
    }
  } catch (error) {
    console.error('登录处理出错:', error);
    showAuthLoading(false);
    showAuthError('登录失败：' + (error.message || '未知错误'), false);
  }
}

async function handleEmailRegister(event) {
  event.preventDefault();
  showAuthLoading(true);

  const username = document.getElementById('register-username').value;
  const email = document.getElementById('register-email').value;
  const password = document.getElementById('register-password').value;

  try {
    // 使用Supabase直接注册
    const supabase = window.getSupabaseClient();
    if (!supabase) {
      throw new Error('数据库服务未加载');
    }

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: {
          username: username
        }
      }
    });

    if (error) throw error;

    showAuthLoading(false);
    showAuthError('注册成功！请查收邮箱验证链接。如未收到，可点击"重发验证邮件"。', true); // 成功提示，可以自动隐藏
    setTimeout(() => {
      switchToLogin();
    }, 3000);
  } catch (error) {
    showAuthLoading(false);
    let errorMessage = '注册失败';

    if (error.message.includes('User already registered')) {
      errorMessage = '该邮箱已被注册';
    } else if (error.message.includes('Password should be')) {
      errorMessage = '密码格式不符合要求';
    } else if (error.message) {
      errorMessage = error.message;
    }

    showAuthError(errorMessage, false); // 关键错误，不自动隐藏
  }
}

async function handleForgotPassword(event) {
  event.preventDefault();
  showAuthLoading(true);

  const email = document.getElementById('forgot-email').value;

  try {
    // 使用Supabase直接发送重置邮件
    const supabase = window.getSupabaseClient();
    if (!supabase) {
      throw new Error('数据库服务未加载');
    }

    // 构建重置密码的重定向URL
    const baseurl = window.PC_BASEURL || '';
    const redirectTo = window.location.origin + baseurl + '/auth/reset-password.html';
    
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: redirectTo
    });

    if (error) throw error;

    showAuthLoading(false);
    
    // 隐藏表单，显示成功提示
    const forgotPasswordForm = document.getElementById('forgot-password-form');
    if (forgotPasswordForm) {
      forgotPasswordForm.style.display = 'none';
    }
    
    // 显示成功提示（不自动隐藏，直到用户点击返回登录）
    showAuthError('密码重置链接已发送到您的邮箱，请查收。', false); // 保留提示，不自动隐藏
    
    // 隐藏邮箱输入框，但保留"返回登录"链接可见
    const emailInput = document.getElementById('forgot-email');
    if (emailInput) {
      emailInput.closest('.auth-form-group')?.style.setProperty('display', 'none');
    }
  } catch (error) {
    showAuthLoading(false);
    showAuthError('发送失败：' + (error.message || '请检查邮箱地址是否正确'), false); // 关键错误，不自动隐藏
  }
}

async function handleResendConfirmationEmail(event) {
  event.preventDefault();
  showAuthLoading(true);

  const email = document.getElementById('resend-email').value;

  try {
    // 使用Supabase直接重发验证邮件
    const supabase = window.getSupabaseClient();
    if (!supabase) {
      throw new Error('数据库服务未加载');
    }

    const { error } = await supabase.auth.resend({
      type: 'signup',
      email: email
    });

    if (error) throw error;

    showAuthLoading(false);
    showAuthError('验证邮件已重新发送，请查收邮箱。', true); // 成功提示，可以自动隐藏
    setTimeout(() => {
      switchToLogin();
    }, 3000);
  } catch (error) {
    showAuthLoading(false);
    showAuthError('发送失败：' + (error.message || '请检查邮箱地址是否正确'), false); // 关键错误，不自动隐藏
  }
}

// 按ESC键关闭模态框
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    closeAuthModal();
  }
});
</script>
