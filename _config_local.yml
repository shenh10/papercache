# 本地开发环境配置
# 继承主配置文件并覆盖特定设置

# 本地开发时 baseurl 为空，避免路径问题
baseurl: ""
url: "http://127.0.0.1:4000"

# 本地开发时包含 slides 页面（生产环境不包含）
header_pages:
  - 01-index.markdown
  - 02-collection.html
  - 03-about.markdown
  - 04-slides.html

# Collections 配置 - 仅在本地开发时启用 slides
collections:
  slides:
    output: true
    permalink: /slides/:categories/:year/:month/:day/:title.html

# 默认设置 - 本地开发时处理 _slides 目录
defaults:
  - scope:
      path: "_slides"
      type: "slides"
    values:
      layout: "post"
      comments: true
      mathjax: true
      share: true
      permalink: /slides/:categories/:year/:month/:day/:title.html

# 本地开发时不排除 slides 相关文件（_slides/ 需要被 Jekyll 处理）
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .DS_Store
  # 注意：不排除 _slides/，让 Jekyll 在本地开发时处理