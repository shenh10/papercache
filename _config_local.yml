# 本地开发环境配置
# 继承主配置文件并覆盖特定设置

# 本地开发时 baseurl 为空，避免路径问题
baseurl: ""
url: "http://127.0.0.1:4000"

# 包含slides页面
header_pages:
  - 01-index.markdown
  - 02-collection.html
  - 03-about.markdown
  - 04-slides.html

# 本地开发时不排除slides相关文件
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - .DS_Store