layout: default
title: 重置密码
permalink: /auth/reset-password.html
---

<div class="auth-verify-container">
  <div class="auth-verify-content">
    <h1>重置密码</h1>
    <p>请输入您的新密码</p>
    
    <form id="reset-password-form" style="margin-top: 1.5rem;">
      <div class="auth-form-group">
        <label for="new-password">新密码</label>
        <input type="password" id="new-password" name="password" required autocomplete="new-password" minlength="6">
        <small class="auth-form-help">至少6个字符</small>
      </div>
      
      <div class="auth-form-group">
        <label for="confirm-password">确认密码</label>
        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" minlength="6">
      </div>
      
      <button type="submit" class="auth-btn auth-btn-primary" style="width: 100%; margin-top: 1rem;">更新密码</button>
    </form>
    
    <div id="reset-password-error" class="auth-error" style="display: none; margin-top: 1rem;">
      <p id="reset-password-error-message"></p>
    </div>
    
    <div id="reset-password-success" style="display: none; margin-top: 1rem; padding: 1rem; background: #d1fae5; border-radius: 8px; color: #065f46;">
      <p>✓ 密码重置成功！正在跳转...</p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  // 等待Supabase客户端初始化
  function checkSupabaseReady() {
    if (window.getSupabaseClient && window.getSupabaseClient()) {
      handlePasswordReset();
    } else {
      setTimeout(checkSupabaseReady, 100);
    }
  }
  
  function handlePasswordReset() {
    const supabase = window.getSupabaseClient();
    if (!supabase) {
      showError('Supabase客户端未初始化');
      return;
    }
    
    // 检查URL hash中是否有恢复token
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');
    const type = hashParams.get('type');
    
    // 监听认证状态变化，确认是密码重置流程
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (session && type === 'recovery')) {
        // 用户已通过密码重置链接验证，可以设置新密码
        document.getElementById('reset-password-form').style.display = 'block';
      }
    });
    
    // 检查当前session
    supabase.auth.getSession().then(({ data: { session }, error }) => {
      if (session && (hashParams.get('type') === 'recovery' || hashParams.get('type') === 'reset')) {
        // 已通过验证，显示表单
        document.getElementById('reset-password-form').style.display = 'block';
      } else if (!accessToken && !session) {
        showError('无效的重置链接。请重新请求密码重置。');
      }
    });
    
    // 处理表单提交
    const form = document.getElementById('reset-password-form');
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      if (newPassword !== confirmPassword) {
        showError('两次输入的密码不一致');
        return;
      }
      
      if (newPassword.length < 6) {
        showError('密码至少需要6个字符');
        return;
      }
      
      // 更新密码
      const result = await window.authService?.updatePassword(newPassword);
      
      if (result?.success) {
        document.getElementById('reset-password-form').style.display = 'none';
        document.getElementById('reset-password-success').style.display = 'block';
        
        // 清除hash并跳转到首页
        setTimeout(() => {
          const baseUrl = window.location.pathname.startsWith('/papercache') 
            ? '/papercache/' 
            : '/';
          window.location.href = baseUrl;
        }, 1500);
      } else {
        showError(result?.error || '密码更新失败');
      }
    });
  }
  
  function showError(message) {
    const errorDiv = document.getElementById('reset-password-error');
    const errorMsg = document.getElementById('reset-password-error-message');
    if (errorDiv && errorMsg) {
      errorMsg.textContent = message;
      errorDiv.style.display = 'block';
    }
  }
  
  // 页面加载后开始检查
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkSupabaseReady);
  } else {
    checkSupabaseReady();
  }
})();
</script>
