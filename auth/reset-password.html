---
layout: default
title: 重置密码
permalink: /auth/reset-password.html
---

<div class="auth-verify-container">
  <div class="auth-verify-content">
    <h1>重置密码</h1>
    <p>请输入您的新密码</p>
    
    <form id="reset-password-form" style="margin-top: 1.5rem;">
      <div class="auth-form-group">
        <label for="new-password">新密码</label>
        <input type="password" id="new-password" name="password" required autocomplete="new-password" minlength="6">
        <small class="auth-form-help">至少6个字符</small>
      </div>
      
      <div class="auth-form-group">
        <label for="confirm-password">确认密码</label>
        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" minlength="6">
      </div>
      
      <button type="submit" class="auth-btn auth-btn-primary" style="width: 100%; margin-top: 1rem;">更新密码</button>
    </form>
    
    <div id="reset-password-error" class="auth-error" style="display: none; margin-top: 1rem;">
      <p id="reset-password-error-message"></p>
    </div>
    
    <div id="reset-password-success" style="display: none; margin-top: 1rem; padding: 1rem; background: #d1fae5; border-radius: 8px; color: #065f46;">
      <p>✓ 密码重置成功！正在跳转...</p>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  // 检查并修复路径（如果访问的路径不包含baseurl，重定向到正确的路径）
  (function() {
    const baseurl = {{ site.baseurl | jsonify }} || '';
    const currentPath = window.location.pathname;
    
    // 如果当前路径不包含baseurl，且baseurl不为空，则重定向
    if (baseurl && baseurl !== '/' && !currentPath.startsWith(baseurl)) {
      const hash = window.location.hash || '';
      const search = window.location.search || '';
      window.location.replace(baseurl + '/auth/reset-password.html' + search + hash);
      return;
    }
  })();
  
  // 等待Supabase客户端初始化
  function checkSupabaseReady() {
    if (window.getSupabaseClient && window.getSupabaseClient()) {
      handlePasswordReset();
    } else {
      setTimeout(checkSupabaseReady, 100);
    }
  }
  
  function handlePasswordReset() {
    const supabase = window.getSupabaseClient();
    if (!supabase) {
      showError('Supabase客户端未初始化');
      return;
    }
    
    // 检查URL hash中的参数
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');
    const type = hashParams.get('type');
    
    // 检查是否有错误参数（链接过期、无效等）
    const error = hashParams.get('error');
    const errorCode = hashParams.get('error_code');
    const errorDescription = hashParams.get('error_description');
    
    if (error) {
      // 处理错误情况（链接过期、无效等）
      let errorMessage = '重置链接';
      if (errorCode === 'otp_expired') {
        errorMessage = '重置链接已过期。';
      } else if (errorDescription) {
        errorMessage = decodeURIComponent(errorDescription);
      } else {
        errorMessage = '重置链接无效。';
      }
      errorMessage += ' 请重新请求密码重置。';
      showError(errorMessage);
      
      // 显示重新请求的提示
      const contentDiv = document.querySelector('.auth-verify-content');
      if (contentDiv) {
        const retryDiv = document.createElement('div');
        retryDiv.style.cssText = 'margin-top: 1rem; padding: 1rem; background: #fef3c7; border-radius: 8px;';
        retryDiv.innerHTML = '<p style="margin: 0 0 0.5rem 0; color: #92400e;">需要新的重置链接？</p><a href="/papercache/" onclick="if(window.openAuthModal){event.preventDefault();window.openAuthModal(\'login\');return false;}" style="color: #667eea; text-decoration: underline;">点击这里重新请求</a>';
        contentDiv.appendChild(retryDiv);
      }
      return;
    }
    
    // 监听认证状态变化，确认是密码重置流程
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (session && type === 'recovery')) {
        // 用户已通过密码重置链接验证，可以设置新密码
        document.getElementById('reset-password-form').style.display = 'block';
      }
    });
    
    // 检查当前session
    supabase.auth.getSession().then(({ data: { session }, error }) => {
      if (session && (hashParams.get('type') === 'recovery' || hashParams.get('type') === 'reset')) {
        // 已通过验证，显示表单
        document.getElementById('reset-password-form').style.display = 'block';
      } else if (!accessToken && !session) {
        showError('无效的重置链接。请重新请求密码重置。');
      }
    });
    
    // 处理表单提交
    const form = document.getElementById('reset-password-form');
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      if (newPassword !== confirmPassword) {
        showError('两次输入的密码不一致');
        return;
      }
      
      if (newPassword.length < 6) {
        showError('密码至少需要6个字符');
        return;
      }
      
      // 等待 SimpleAuth 初始化
      let waitCount = 0;
      while (waitCount < 50 && (!window.SimpleAuth || typeof window.SimpleAuth.updatePassword !== 'function')) {
        await new Promise(resolve => setTimeout(resolve, 100));
        waitCount++;
      }
      
      if (!window.SimpleAuth || typeof window.SimpleAuth.updatePassword !== 'function') {
        // 如果 SimpleAuth 不可用，直接使用 Supabase
        try {
          const { error } = await supabase.auth.updateUser({
            password: newPassword
          });
          
          if (error) throw error;
          
          // 密码更新成功
          document.getElementById('reset-password-form').style.display = 'none';
          document.getElementById('reset-password-success').style.display = 'block';
          
          // 清除hash并跳转到首页
          setTimeout(() => {
            const baseurl = window.PC_BASEURL || '';
            // 确保以 / 结尾，跳转到首页
            const baseUrl = baseurl ? (baseurl.endsWith('/') ? baseurl : baseurl + '/') : '/';
            window.location.href = baseUrl;
          }, 1500);
        } catch (error) {
          console.error('密码更新失败:', error);
          showError(error?.message || '密码更新失败，请重试');
        }
      } else {
        // 使用 SimpleAuth 更新密码
        try {
          await window.SimpleAuth.updatePassword(newPassword);
          
          // 密码更新成功
          document.getElementById('reset-password-form').style.display = 'none';
          document.getElementById('reset-password-success').style.display = 'block';
          
          // 清除hash并跳转到首页
          setTimeout(() => {
            const baseurl = window.PC_BASEURL || '';
            // 确保以 / 结尾，跳转到首页
            const baseUrl = baseurl ? (baseurl.endsWith('/') ? baseurl : baseurl + '/') : '/';
            window.location.href = baseUrl;
          }, 1500);
        } catch (error) {
          console.error('密码更新失败:', error);
          showError(error?.message || '密码更新失败，请重试');
        }
      }
    });
  }
  
  function showError(message) {
    const errorDiv = document.getElementById('reset-password-error');
    const errorMsg = document.getElementById('reset-password-error-message');
    if (errorDiv && errorMsg) {
      errorMsg.textContent = message;
      errorDiv.style.display = 'block';
    }
  }
  
  // 页面加载后开始检查
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkSupabaseReady);
  } else {
    checkSupabaseReady();
  }
})();
</script>
